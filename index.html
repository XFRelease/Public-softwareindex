<style>

         color: #2C3E50; min-height: 100vh; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 40px; }

  /* 顶部横幅 */
  header { background: linear-gradient(135deg, #1E6FD9 0%, #3B82F6 60%, #5B8DEF 100%);

  header .stats { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,.16); backdrop-filter: blur(4px);

  .cbtn:hover { border-color: #3B82F6; color: #2563EB; }
  .cbtn-on { background: #2563EB; border-color: #2563EB; color: #fff; }

  .dl { display: inline-block; padding: 3px 12px; border-radius: 6px;

  .dl-doc { background: #FDF3E3; border-color: #F0DDB8; color: #B9770E !important; }
  .dl-doc:hover { background: #B9770E; }
  .none { color: #C3CDD8; }

  /* 更新备注区块（表格下方，支持多行） */
  .notes { margin-top: 14px; }
  .notes-title { font-size: 12.5px; color: #5B7A99; font-weight: 600;
                 letter-spacing: .5px; margin-bottom: 8px; }
  .note-item { display: flex; gap: 10px; padding: 8px 12px; border-radius: 8px;
               background: #F7F9FC; border: 1px solid #E8EEF5; margin-bottom: 6px; }
  .note-item:last-child { margin-bottom: 0; }
  .note-ver { flex: none; font-size: 12px; font-weight: 600; color: #2563EB;
              background: #EAF1FD; border: 1px solid #C9DCF5; border-radius: 6px;
              padding: 1px 8px; height: fit-content; margin-top: 1px; }
  .note-body { font-size: 12.5px; color: #5B6B7E; line-height: 1.7;
               white-space: normal; word-break: break-word; }

  /* 状态徽章 */
  .st { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; }
  .st-both { background: #E8F8EE; color: #1E8E4E; border: 1px solid #C4E9D2; }
  .st-gh   { background: #EAF1FD; color: #2563EB; border: 1px solid #C9DCF5; }
  .st-bd   { background: #E8F8EE; color: #1E8E4E; border: 1px solid #C4E9D2; }
  .st-wait { background: #EDF1F5; color: #8494A7; border: 1px solid #D8E0E8; }

  /* 搜索框 + 筛选 */
  .toolbar { margin: 18px 0 0; display: flex; gap: 10px; }
  .search { position: relative; flex: 1; }
  .search input { width: 100%; box-sizing: border-box; padding: 10px 14px 10px 40px;
                  border: 1px solid #D5DEE8; border-radius: 10px; font-size: 14px;
                  outline: none; background: #fff; transition: border .2s, box-shadow .2s; }
  .search input:focus { border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .search .ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
                 color: #97A6B8; font-size: 15px; pointer-events: none; }
  .filters { display: flex; gap: 6px; align-items: center; }
  .fbtn { border: 1px solid #D5DEE8; background: #fff; color: #4A5D73; cursor: pointer;
          padding: 8px 16px; border-radius: 10px; font-size: 13px; font-family: inherit;
          transition: all .15s; }
  .fbtn:hover { border-color: #3B82F6; color: #2563EB; }
  .fbtn.on { background: #3B82F6; border-color: #3B82F6; color: #fff; }
  .fbtn.on-fee { background: #1E8E4E; border-color: #1E8E4E; }
  .card.hidden { display: none; }
  .empty { text-align: center; color: #97A6B8; padding: 40px 0; display: none; }

  footer { text-align: center; color: #A5B3C2; font-size: 12px; margin-top: 26px; }

  @media (max-width: 720px) {
    header { padding: 24px 20px 20px; border-radius: 0 0 12px 12px; }
    .card { padding: 14px 14px; }
    table { font-size: 12px; }
    td, th { padding: 6px 6px; }
  }
</style>

<script>
(function () {
  var kw = document.getElementById('kw');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var empty = document.getElementById('empty');
  var filter = 'all';
  var cat = '';

  function apply() {
    var v = kw.value.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function (c) {
      var hitKw = !v || c.getAttribute('data-kw').indexOf(v) !== -1;
      var hitFee = filter === 'all' || c.getAttribute('data-fee') === filter;
      var hitCat = !cat || c.getAttribute('data-cat') === cat;
      var hit = hitKw && hitFee && hitCat;
      c.classList.toggle('hidden', !hit);
      if (hit) shown++;
    });
    empty.style.display = shown ? 'none' : 'block';
  }

  kw.addEventListener('input', apply);

  Array.prototype.forEach.call(document.querySelectorAll('.fbtn'), function (b) {
    b.addEventListener('click', function () {
      document.querySelector('.fbtn.on').classList.remove('on');
      b.classList.add('on');
      filter = b.getAttribute('data-f');
      apply();
    });
  });

  // 分类标签栏：从卡片收集去重分类，动态生成到搜索框下方；点击筛选，再点取消
  var catsBox = document.getElementById('cats');
  var catNames = [];
  cards.forEach(function (c) {
    var v = c.getAttribute('data-cat');
    if (v && catNames.indexOf(v) === -1) catNames.push(v);
  });
  catNames.sort(function (a, b) { return a.localeCompare(b, 'zh-Hans-CN'); });
  catNames.forEach(function (name) {
    var b = document.createElement('button');
    b.className = 'cbtn';
    b.setAttribute('data-cat', name);
    b.textContent = name;
    b.addEventListener('click', function () {
      if (cat === name) { cat = ''; b.classList.remove('cbtn-on'); }
      else {
        cat = name;
        Array.prototype.forEach.call(catsBox.querySelectorAll('.cbtn'), function (x) { x.classList.remove('cbtn-on'); });
        b.classList.add('cbtn-on');
      }
      apply();
    });
    catsBox.appendChild(b);
  });
  if (catNames.length) catsBox.style.display = 'flex';
})();
</script>
